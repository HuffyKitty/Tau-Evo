name: Evo experiments

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --dev --locked
      - run: uv run pytest -q tests/test_evo.py tests/test_evo_learning.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --follow-imports=silent src/tau_coding/evo src/tau_coding/extensions/evo_harness

